name: Release

on:
  workflow_dispatch:
    inputs:
      qualification:
        description: Independently accepted qualification record
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pioneer-release
  cancel-in-progress: false

env:
  PIONEER_PATHS: |
    import { appendFileSync } from 'node:fs';
    import { isAbsolute, join } from 'node:path';
    const root = process.env.RUNNER_TEMP;
    if (typeof root !== 'string' || !isAbsolute(root) || /[\r\n]/.test(root)) throw new Error('Resolve runner paths: invalid temporary directory');
    const paths = { PIONEER_TOOL_RECORD: 'tools.json', PIONEER_ARCHIVES: 'archives', PIONEER_EXTRACTED: 'extracted' };
    appendFileSync(process.env.GITHUB_ENV, Object.entries(paths).map(([name, path]) => `${name}=${join(root, path)}\n`).join(''));
  PIONEER_SCAN: |
    import { execFileSync } from 'node:child_process';
    import { createHash } from 'node:crypto';
    import { createReadStream } from 'node:fs';
    import { lstat, opendir, writeFile } from 'node:fs/promises';
    import { join } from 'node:path';
    const root = process.env.PIONEER_SCAN_ROOT;
    const paths = [];
    async function visit(directory, prefix) {
      for await (const item of await opendir(directory)) {
        const path = prefix ? `${prefix}/${item.name}` : item.name;
        const info = await lstat(join(root, path));
        if (info.isSymbolicLink()) throw new Error('Collect canonical inventory: links are forbidden');
        if (info.isDirectory()) await visit(join(root, path), path);
        else if (info.isFile()) paths.push(path);
        else throw new Error('Collect canonical inventory: unexpected member type');
        if (paths.length > 50000) throw new Error('Collect canonical inventory: too many members');
      }
    }
    if (process.env.PIONEER_SCAN_TRACKED === 'true') paths.push(...execFileSync('git', ['ls-files', '-z'], { cwd: root, encoding: 'utf8', timeout: 10000, maxBuffer: 8 * 1024 * 1024 }).split('\0').filter(Boolean));
    else await visit(root, '');
    const entries = [];
    for (const path of paths.sort()) {
      const info = await lstat(join(root, path));
      if (!info.isFile() || info.isSymbolicLink()) throw new Error('Collect canonical inventory: expected a regular file');
      const hash = createHash('sha256');
      for await (const bytes of createReadStream(join(root, path))) hash.update(bytes);
      entries.push({ path, sha256: hash.digest('hex'), mode: info.mode & 0o777 });
    }
    const bytes = `${JSON.stringify(entries)}\n`;
    if (Buffer.byteLength(bytes) > 8 * 1024 * 1024) throw new Error('Collect canonical inventory: manifest exceeds eight MiB');
    await writeFile(process.env.PIONEER_SCAN_OUTPUT, bytes, { flag: 'wx', mode: 0o644 });
  PIONEER_TOOLS: |
    import { execFileSync } from 'node:child_process';
    import { realpathSync, writeFileSync } from 'node:fs';
    import { dirname, join } from 'node:path';
    if (process.env.PIONEER_APPROVAL !== undefined && Buffer.byteLength(process.env.PIONEER_APPROVAL) > 8192) throw new Error('Verify release control: protected record exceeds eight KiB');
    const expected = process.env.PIONEER_NODE;
    if (!['20.19.0', '24.22.0'].includes(expected) || process.versions.node !== expected) throw new Error('Verify toolchain: wrong Node version');
    const platform = { 'ubuntu-24.04': ['linux', 'x64'], 'macos-14': ['darwin', 'arm64'], 'windows-2022': ['win32', 'x64'] }[process.env.PIONEER_RUNNER];
    if (!platform || platform[0] !== process.platform || platform[1] !== process.arch) throw new Error('Verify toolchain: runner platform or architecture differs from approval');
    const npm = realpathSync(process.platform === 'win32' ? join(dirname(process.execPath), 'node_modules/npm/bin/npm-cli.js') : join(dirname(process.execPath), '../lib/node_modules/npm/bin/npm-cli.js'));
    const version = execFileSync(process.execPath, [npm, '--version'], { encoding: 'utf8', timeout: 10000 }).trim();
    if (version !== (expected === '20.19.0' ? '10.8.2' : '11.19.1')) throw new Error('Verify toolchain: wrong bundled npm version');
    const tools = { node: expected, npm: version, bun: null, nodePath: process.execPath, npmPath: npm, bunPath: null, platform: process.platform, arch: process.arch, runner: process.env.PIONEER_RUNNER, image: process.env.ImageVersion };
    if (process.env.PIONEER_BUN) {
      tools.bunPath = realpathSync(process.env.PIONEER_BUN);
      tools.bun = execFileSync(tools.bunPath, ['--version'], { encoding: 'utf8', timeout: 10000 }).trim();
      if (tools.bun !== '1.4.3') throw new Error('Verify toolchain: wrong Bun version');
    }
    if (!tools.image) throw new Error('Verify toolchain: missing runner image version');
    writeFileSync(process.env.PIONEER_TOOL_RECORD, JSON.stringify(tools), { flag: 'wx', mode: 0o644 });
    console.log(JSON.stringify(tools));
  PIONEER_TRANSPORT: |
    import { createHash } from 'node:crypto';
    import { copyFile, lstat, mkdir, open, realpath } from 'node:fs/promises';
    import { constants } from 'node:fs';
    import { dirname, isAbsolute, join, resolve } from 'node:path';
    if (typeof process.env.PIONEER_TRANSFER !== 'string' || Buffer.byteLength(process.env.PIONEER_TRANSFER) > 8192) throw new Error('Validate artifact control: missing or oversized record');
    if (typeof process.env.GITHUB_TOKEN !== 'string' || !process.env.GITHUB_TOKEN || /[\r\n]/.test(process.env.GITHUB_TOKEN)) throw new Error('Validate artifact access: missing or invalid credential');
    const control = JSON.parse(process.env.PIONEER_TRANSFER);
    const identity = control.identity;
    const fail = (id, cause) => { throw new Error(`Artifact ${id}: ${cause}`); };
    const same = (actual, expected) => actual === expected;
    if (!same(identity.repository, 'dgtlkitchen/pioneer') || !same(identity.repositoryId, '1420539345') || !same(process.env.GITHUB_REPOSITORY, identity.repository) || !same(process.env.GITHUB_REPOSITORY_ID, identity.repositoryId) || !same(process.env.GITHUB_SHA, identity.source) || !same(process.env.GITHUB_WORKFLOW_SHA, identity.workflowCommit) || !same(identity.source, identity.workflowCommit) || !same(process.env.GITHUB_RUN_ID, identity.run) || !same(process.env.GITHUB_RUN_ATTEMPT, identity.attempt) || !same(process.env.GITHUB_WORKFLOW_REF, `${identity.repository}/${identity.workflow}@${identity.ref}`) || identity.workflow !== '.github/workflows/release.yml' || process.env.GITHUB_REF !== identity.ref || process.env.GITHUB_EVENT_NAME !== 'workflow_dispatch') fail('control', 'identity mismatch');
    if (!Array.isArray(control.artifacts) || !control.artifacts.length || control.artifacts.length > 16) fail('control', 'invalid artifact set');
    const ids = new Set();
    for (const item of control.artifacts) {
      if (typeof item.id !== 'string' || !/^[1-9][0-9]*$/.test(item.id) || !Number.isSafeInteger(Number(item.id)) || ids.has(item.id) || !/^[a-f0-9]{64}$/.test(item.archiveSha256)) fail('control', 'invalid artifact identity or digest');
      if (item.maxBytes !== undefined && (!Number.isSafeInteger(item.maxBytes) || item.maxBytes < 1 || item.maxBytes > 512 * 1024 * 1024)) fail('control', 'invalid byte ceiling');
      ids.add(item.id);
    }
    const root = resolve(process.env.PIONEER_ARCHIVES);
    if (!isAbsolute(process.env.PIONEER_ARCHIVES) || await realpath(dirname(root)) !== dirname(root)) fail('control', 'unsafe output root');
    await mkdir(root, { recursive: false });
    const cancel = new AbortController();
    process.once('SIGTERM', () => cancel.abort());
    process.once('SIGINT', () => cancel.abort());
    async function cancelBody(response, id) {
      try { if (response?.body && !response.body.locked) await response.body.cancel(); }
      catch { fail(id, 'body cancellation failure'); }
    }
    async function api(id, suffix, consume) {
      const timeout = new AbortController();
      const timer = setTimeout(() => timeout.abort(), 20000);
      try {
        const response = await fetch(`https://api.github.com/repos/dgtlkitchen/pioneer/actions/artifacts/${id}${suffix}`, {
          redirect: 'manual', signal: AbortSignal.any([cancel.signal, timeout.signal]),
          headers: { Authorization: `Bearer ${process.env.GITHUB_TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }
        });
        try { return await consume(response); }
        finally { await cancelBody(response, id); }
      } catch { fail(id, timeout.signal.aborted || cancel.signal.aborted ? 'API timeout or cancellation' : 'API status or response failure'); }
      finally { clearTimeout(timer); timeout.abort(); }
    }
    for (const item of control.artifacts) {
      const id = item.id;
      await api(id, '', async (response) => {
        if (response.status !== 200 || !response.body) fail(id, 'metadata status failure');
        const chunks = [];
        let count = 0;
        for await (const chunk of response.body) {
          count += chunk.length;
          if (count > 65536) fail(id, 'metadata size failure');
          chunks.push(chunk);
        }
        const metadata = JSON.parse(Buffer.concat(chunks).toString('utf8'));
        if (String(metadata.id) !== id || String(metadata.workflow_run?.id) !== identity.run || String(metadata.workflow_run?.repository_id) !== identity.repositoryId || metadata.workflow_run?.head_sha !== identity.source || metadata.expired !== false) fail(id, 'metadata identity mismatch');
      });
      const location = await api(id, '/zip', async (response) => {
        if (response.status !== 302) fail(id, 'ZIP redirect status failure');
        const value = response.headers.get('location');
        if (!value || /[,\r\n]/.test(value)) fail(id, 'missing redirect');
        const url = new URL(value);
        if (url.protocol !== 'https:' || url.username || url.password || url.hash) fail(id, 'unsafe redirect');
        return url;
      });
      const timeout = new AbortController();
      const timer = setTimeout(() => timeout.abort(), 100000);
      let handle;
      let response;
      let classification = 'storage response failure';
      try {
        response = await fetch(location, { redirect: 'manual', credentials: 'omit', signal: AbortSignal.any([cancel.signal, timeout.signal]) });
        if (response.status !== 200 || !response.body) fail(id, classification);
        classification = 'storage size failure';
        const length = response.headers.get('content-length');
        const ceiling = item.maxBytes ?? 512 * 1024 * 1024;
        if (length !== null && (!/^(0|[1-9][0-9]*)$/.test(length) || Number(length) > ceiling)) fail(id, classification);
        classification = 'exclusive output failure';
        const partial = join(root, `${id}.partial`);
        handle = await open(partial, 'wx', 0o600);
        const hash = createHash('sha256');
        let count = 0;
        for await (const chunk of response.body) {
          count += chunk.length;
          classification = 'storage size failure';
          if (count > ceiling) fail(id, classification);
          classification = 'storage write failure';
          await handle.writeFile(chunk);
          hash.update(chunk);
        }
        const digest = hash.digest('hex');
        classification = 'ZIP digest failure';
        if (digest !== item.archiveSha256) fail(id, classification);
        if (timeout.signal.aborted || cancel.signal.aborted) fail(id, 'storage timeout or cancellation');
        await handle.close();
        handle = undefined;
        classification = 'exclusive output failure';
        const path = join(root, `${id}.zip`);
        await copyFile(partial, path, constants.COPYFILE_EXCL);
        if (!(await lstat(path)).isFile()) fail(id, classification);
        console.log(JSON.stringify({ id, bytes: count, path, sha256: digest }));
      } catch { fail(id, timeout.signal.aborted || cancel.signal.aborted ? 'storage timeout or cancellation' : classification); }
      finally {
        clearTimeout(timer);
        timeout.abort();
        await cancelBody(response, id);
        try { if (handle) await handle.close(); }
        catch { fail(id, 'output close failure'); }
      }
    }
  PIONEER_BOOTSTRAP: |
    import { createHash } from 'node:crypto';
    import { createReadStream } from 'node:fs';
    import { lstat, readFile, realpath } from 'node:fs/promises';
    import { delimiter, join, resolve } from 'node:path';
    if (typeof process.env.PIONEER_TRANSFER !== 'string' || Buffer.byteLength(process.env.PIONEER_TRANSFER) > 8192) throw new Error('Verify release helper: missing or oversized control');
    const approval = JSON.parse(process.env.PIONEER_TRANSFER);
    const id = approval.identity;
    const fail = () => { throw new Error('Verify release helper: independent identity or digest mismatch'); };
    if (id.repository !== 'dgtlkitchen/pioneer' || id.repositoryId !== '1420539345' || id.workflow !== '.github/workflows/release.yml' || id.source !== id.workflowCommit || process.env.GITHUB_REPOSITORY !== id.repository || process.env.GITHUB_REPOSITORY_ID !== id.repositoryId || process.env.GITHUB_SHA !== id.source || process.env.GITHUB_WORKFLOW_SHA !== id.workflowCommit || process.env.GITHUB_RUN_ID !== id.run || process.env.GITHUB_RUN_ATTEMPT !== id.attempt || process.env.GITHUB_WORKFLOW_REF !== `${id.repository}/${id.workflow}@${id.ref}` || process.env.GITHUB_REF !== id.ref || process.env.GITHUB_EVENT_NAME !== 'workflow_dispatch') fail();
    const ids = approval.artifacts.map((artifact) => artifact.id);
    const extracted = process.env.PIONEER_EXTRACTED_IDS.split(',');
    if (new Set(ids).size !== ids.length || ids.length !== extracted.length || ids.some((value) => !extracted.includes(value))) fail();
    for (const artifact of approval.artifacts) {
      if (!/^[1-9][0-9]*$/.test(artifact.id) || !Number.isSafeInteger(Number(artifact.id)) || !/^[a-f0-9]{64}$/.test(artifact.archiveSha256)) fail();
      const path = join(process.env.PIONEER_ARCHIVES, `${artifact.id}.zip`);
      if (!(await lstat(path)).isFile() || await realpath(path) !== resolve(path)) fail();
      const hash = createHash('sha256');
      for await (const chunk of createReadStream(path)) hash.update(chunk);
      if (hash.digest('hex') !== artifact.archiveSha256) fail();
    }
    const verifier = process.env.PIONEER_VERIFIER ?? 'release.mjs';
    if (!['release.mjs', 'installed-cli.mjs'].includes(verifier)) fail();
    const helpers = approval.artifacts.flatMap((artifact) => artifact.files.filter((file) => file.path === verifier));
    if (helpers.length !== 1 || !/^[a-f0-9]{64}$/.test(helpers[0].sha256) || (verifier === 'release.mjs' && helpers[0].sha256 !== approval.helperSha256)) fail();
    const path = join(process.env.PIONEER_EXTRACTED, verifier);
    const info = await lstat(path);
    if (!info.isFile() || info.isSymbolicLink() || info.size > 8 * 1024 * 1024 || await realpath(path) !== resolve(path)) fail();
    const bytes = await readFile(path);
    if (createHash('sha256').update(bytes).digest('hex') !== helpers[0].sha256) fail();
    process.argv = [process.execPath, 'verified-release-helper', process.env.PIONEER_MODE, '--input', process.env.PIONEER_INPUT, '--output', process.env.PIONEER_OUTPUT];
    if (verifier === 'installed-cli.mjs') {
      const temporary = process.env.RUNNER_TEMP;
      const environment = { PATH: `${join(temporary, process.platform === 'win32' ? 'prefix' : 'prefix/bin')}${delimiter}${process.env.PATH}`, HOME: join(temporary, 'home'), TMPDIR: temporary, TMP: temporary, TEMP: temporary, CI: 'true' };
      for (const key of ['SystemRoot', 'ComSpec', 'WINDIR']) if (process.env[key]) environment[key] = process.env[key];
      for (const key of Object.keys(process.env)) delete process.env[key];
      Object.assign(process.env, environment);
    }
    await import(`data:text/javascript;base64,${bytes.toString('base64')}`);

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      transfer: ${{ steps.record.outputs.transfer }}
      ids: ${{ steps.record.outputs.ids }}
    env:
      PIONEER_NODE: '24.22.0'
      PIONEER_RUNNER: ubuntu-24.04
      PIONEER_QUALIFICATION: ${{ inputs.qualification }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.0'
      - uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7
        with:
          bun-version: '1.4.3'
      - name: Resolve runner paths
        shell: bash
        run: node --input-type=module -e "$PIONEER_PATHS"
      - name: Verify exact tools and source identity
        shell: bash
        run: |
          set -euo pipefail
          export PIONEER_BUN="$(command -v bun)"
          node --input-type=module -e "$PIONEER_TOOLS"
          PIONEER_SCAN_ROOT="$GITHUB_WORKSPACE" PIONEER_SCAN_OUTPUT="$RUNNER_TEMP/inputs.json" PIONEER_SCAN_TRACKED=true node --input-type=module -e "$PIONEER_SCAN"
          node --input-type=module <<'IDENTITY'
          import { execFileSync } from 'node:child_process';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          if (typeof process.env.PIONEER_QUALIFICATION !== 'string' || Buffer.byteLength(process.env.PIONEER_QUALIFICATION) > 1024) throw new Error('Validate dispatch: missing or oversized control');
          const control = JSON.parse(process.env.PIONEER_QUALIFICATION);
          if (Object.keys(control).sort().join(',') !== 'inputManifestSha256,sourceCommit,workflowCommit') throw new Error('Validate dispatch: expected compact accepted identity');
          const identity = { repository: 'dgtlkitchen/pioneer', repositoryId: '1420539345', source: control.sourceCommit, workflowCommit: control.workflowCommit, workflow: '.github/workflows/release.yml', ref: process.env.GITHUB_REF, run: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT, inputSha256: control.inputManifestSha256 };
          const actions = { checkout: '11d5960a326750d5838078e36cf38b85af677262', node: '49933ea5288caeca8642d1e84afbd3f7d6820020', bun: 'f4d14e03ff726c06358e5557344e1da148b56cf7', upload: 'ea165f8d65b6e75b540449e92b4886f43607fa02', download: 'd3f86a106a0bac45b974a628896c90dbdf5c8093' };
          const expected = { identity, actions };
          const observed = { identity: expected.identity, toolchain: JSON.parse(readFileSync(process.env.PIONEER_TOOL_RECORD)), head: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8', timeout: 10000 }).trim() };
          writeFileSync(join(process.env.RUNNER_TEMP, 'identity-input.json'), JSON.stringify({ expected, observed, package: join(process.env.GITHUB_WORKSPACE, 'package.json'), sourceRoot: process.env.GITHUB_WORKSPACE, sourceManifest: join(process.env.RUNNER_TEMP, 'inputs.json') }), { flag: 'wx' });
          IDENTITY
          node src/release.mjs identity --input "$RUNNER_TEMP/identity-input.json" --output "$RUNNER_TEMP/identity.json"
      - name: Snapshot accepted source and isolate qualification
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find . -type f \( -name .env -o -name '.env.*' -o -name .npmrc \) -print -quit)"
          node --input-type=module <<'SNAPSHOT'
          import { copyFileSync, mkdirSync, readFileSync } from 'node:fs';
          import { dirname, join } from 'node:path';
          const accepted = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'identity.json')));
          const root = join(process.env.RUNNER_TEMP, 'source');
          mkdirSync(root);
          for (const entry of accepted.source) {
            const target = join(root, entry.path);
            mkdirSync(dirname(target), { recursive: true });
            copyFileSync(join(process.env.GITHUB_WORKSPACE, entry.path), target);
          }
          mkdirSync(join(process.env.RUNNER_TEMP, 'home'));
          SNAPSHOT
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/home" TMPDIR="$RUNNER_TEMP" CI=true bash --noprofile --norc <<'QUALIFY'
          set -euo pipefail
          bun --no-env-file --no-install install --frozen-lockfile --ignore-scripts
          bun --no-env-file --no-install run lint
          bun --no-env-file --no-install run typecheck
          bun --no-env-file --no-install run build
          node --input-type=module <<'BINMODE'
          import assert from 'node:assert/strict';
          import { chmod, lstat, readFile, realpath } from 'node:fs/promises';
          import { resolve } from 'node:path';
          const manifest = JSON.parse(await readFile('package.json', 'utf8'));
          assert.deepEqual(manifest.bin, { pioneer: './dist/cli.js' }, 'Normalize CLI mode: unexpected declared bin');
          const path = resolve('dist/cli.js');
          const info = await lstat(path);
          assert(info.isFile() && !info.isSymbolicLink() && await realpath(path) === path, 'Normalize CLI mode: expected a regular package-local bin');
          await chmod(path, 0o755);
          BINMODE
          bun --no-env-file --no-install run test:unit
          QUALIFY
          PIONEER_SCAN_ROOT="$GITHUB_WORKSPACE" PIONEER_SCAN_OUTPUT="$RUNNER_TEMP/source-after.json" PIONEER_SCAN_TRACKED=true node --input-type=module -e "$PIONEER_SCAN"
          node --input-type=module <<'UNCHANGED'
          import { createHash } from 'node:crypto';
          import { createReadStream, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const accepted = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'identity.json')));
          const hash = createHash('sha256');
          for await (const bytes of createReadStream(join(process.env.RUNNER_TEMP, 'source-after.json'))) hash.update(bytes);
          if (hash.digest('hex') !== accepted.identity.inputSha256) throw new Error('Qualify source: tracked input changed during checks');
          UNCHANGED
          PIONEER_SCAN_ROOT="$GITHUB_WORKSPACE/dist" PIONEER_SCAN_OUTPUT="$RUNNER_TEMP/build.json" node --input-type=module -e "$PIONEER_SCAN"
      - name: Stage the tested build and generate only the accepted closure
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'STAGE'
          import { copyFileSync, mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { dirname, join } from 'node:path';
          import ts from 'typescript';
          const accepted = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'identity.json')));
          const build = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'build.json')));
          for (const directory of ['staging', 'closure', 'artifact']) mkdirSync(join(process.env.RUNNER_TEMP, directory));
          const entries = [...build.map((entry) => ({ ...entry, path: `dist/${entry.path}` })), ...accepted.source.filter((entry) => ['package.json', 'LICENSE', 'README.md', 'NOTICE'].includes(entry.path) || entry.path.startsWith('src/runtime/'))];
          for (const entry of entries) {
            if (typeof entry.path !== 'string' || entry.path.split('/').some((part) => !part || part === '.' || part === '..') || /[\\:]/.test(entry.path)) throw new Error('Stage accepted member: unsafe path');
            const target = join(process.env.RUNNER_TEMP, 'staging', entry.path);
            mkdirSync(dirname(target), { recursive: true });
            copyFileSync(join(process.env.GITHUB_WORKSPACE, entry.path), target);
          }
          const manifest = JSON.parse(readFileSync('package.json'));
          const parsed = ts.parseConfigFileTextToJson('bun.lock', readFileSync('bun.lock', 'utf8'));
          if (parsed.error) throw new Error('Stage runtime closure: invalid Bun lock');
          const overrides = {};
          const visited = new Set();
          function pin(name) {
            if (visited.has(name)) return;
            visited.add(name);
            const entry = parsed.config.packages[name];
            if (!Array.isArray(entry) || entry.length !== 4 || !entry[0].startsWith(`${name}@`)) throw new Error(`Stage runtime closure: missing Bun resolution for ${name}`);
            const version = entry[0].slice(name.length + 1);
            if (!Object.hasOwn(manifest.dependencies, name)) overrides[name] = version;
            for (const dependency of Object.keys({ ...entry[2].dependencies, ...entry[2].optionalDependencies })) pin(dependency);
          }
          for (const name of Object.keys(manifest.dependencies)) pin(name);
          writeFileSync(join(process.env.RUNNER_TEMP, 'closure/package.json'), JSON.stringify({ name: manifest.name, version: manifest.version, dependencies: manifest.dependencies, overrides }), { flag: 'wx' });
          STAGE
          NPM_CLI=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.env.PIONEER_TOOL_RECORD)).npmPath')
          cd "$RUNNER_TEMP/closure"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/home" TMPDIR="$RUNNER_TEMP" CI=true node "$NPM_CLI" install --package-lock-only --ignore-scripts --include=optional --no-audit --fund=false
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/home" TMPDIR="$RUNNER_TEMP" CI=true node "$NPM_CLI" shrinkwrap --ignore-scripts
          cp npm-shrinkwrap.json "$RUNNER_TEMP/staging/npm-shrinkwrap.json"
          PIONEER_SCAN_ROOT="$RUNNER_TEMP/staging" PIONEER_SCAN_OUTPUT="$RUNNER_TEMP/members.json" node --input-type=module -e "$PIONEER_SCAN"
          cd "$RUNNER_TEMP/staging"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/home" TMPDIR="$RUNNER_TEMP" CI=true node "$NPM_CLI" pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/artifact" > "$RUNNER_TEMP/pack.json"
      - name: Freeze immutable candidate and verification assets
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'CANDIDATE'
          import { copyFileSync, readFileSync, renameSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const temporary = process.env.RUNNER_TEMP;
          const accepted = JSON.parse(readFileSync(join(temporary, 'identity.json')));
          const pack = JSON.parse(readFileSync(join(temporary, 'pack.json')));
          if (pack.length !== 1 || pack[0].filename !== 'vastward-pioneer-0.0.1.tgz') throw new Error('Freeze candidate: unexpected packed filename');
          renameSync(join(temporary, 'artifact', pack[0].filename), join(temporary, 'artifact/pioneer.tgz'));
          copyFileSync('src/release.mjs', join(temporary, 'artifact/release.mjs'));
          copyFileSync('tests/fixtures/installed-cli.mjs', join(temporary, 'artifact/installed-cli.mjs'));
          const approval = { ...accepted, build: JSON.parse(readFileSync(join(temporary, 'build.json'))), members: JSON.parse(readFileSync(join(temporary, 'members.json'))), lockSha256: accepted.source.find((entry) => entry.path === 'bun.lock').sha256, inputManifest: join(temporary, 'inputs.json'), inputManifestSha256: accepted.identity.inputSha256 };
          const input = { approval, source: join(temporary, 'source'), build: join(process.env.GITHUB_WORKSPACE, 'dist'), staging: join(temporary, 'staging'), manifest: join(temporary, 'staging/package.json'), bunLock: join(temporary, 'source/bun.lock'), shrinkwrap: join(temporary, 'staging/npm-shrinkwrap.json'), pack: join(temporary, 'pack.json'), tarball: join(temporary, 'artifact/pioneer.tgz') };
          writeFileSync(join(temporary, 'candidate-input.json'), JSON.stringify(input), { flag: 'wx' });
          CANDIDATE
          node src/release.mjs candidate --input "$RUNNER_TEMP/candidate-input.json" --output "$RUNNER_TEMP/artifact/candidate.json"
      - name: Derive shared content inventories from accepted platform closures
        shell: bash
        run: |
          node --input-type=module <<'CONTENTS'
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { createReadStream } from 'node:fs';
          import { lstat, mkdir, opendir, readFile, realpath, writeFile } from 'node:fs/promises';
          import { dirname, join, posix, resolve } from 'node:path';
          import { isDeepStrictEqual } from 'node:util';
          const temporary = process.env.RUNNER_TEMP;
          const candidatePath = join(temporary, 'artifact/candidate.json');
          const candidateBytes = await readFile(candidatePath);
          const candidate = JSON.parse(candidateBytes);
          const tools = JSON.parse(await readFile(process.env.PIONEER_TOOL_RECORD));
          const contents = { identity: candidate.identity, candidateSha256: createHash('sha256').update(candidateBytes).digest('hex'), platforms: {} };
          const matches = (values, actual) => !values.includes(`!${actual}`) && (!values.some((value) => !value.startsWith('!')) || values.includes(actual));
          const safe = (path) => { if (typeof path !== 'string' || !path || path.length > 4096 || /[\\:\u0000-\u001f\u007f]/.test(path) || path.split('/').some((part) => !part || part === '.' || part === '..')) throw new Error('Collect package content: unsafe member'); return path; };
          function bins(value) {
            if (value === null || typeof value !== 'object' || Array.isArray(value)) throw new Error('Collect package bins: expected a bin map');
            return Object.fromEntries(Object.entries(value).map(([name, target]) => {
              if (!/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(name) || typeof target !== 'string') throw new Error('Collect package bins: unsafe command or target');
              return [name, safe(target.startsWith('./') ? target.slice(2) : target)];
            }));
          }
          async function collect(root, directory = root, prefix = '') {
            const result = [];
            if (await realpath(root) !== resolve(root)) throw new Error('Collect package content: linked package root');
            for await (const item of await opendir(directory)) {
              if (!prefix && item.name === 'node_modules') continue;
              const path = safe(prefix ? `${prefix}/${item.name}` : item.name);
              const absolute = join(root, path);
              const info = await lstat(absolute);
              if (info.isSymbolicLink()) throw new Error('Collect package content: package link is forbidden');
              if (info.isDirectory()) result.push(...await collect(root, absolute, path));
              else if (info.isFile()) {
                const hash = createHash('sha256');
                for await (const bytes of createReadStream(absolute)) hash.update(bytes);
                result.push({ path, sha256: hash.digest('hex'), mode: info.mode & 0o777 });
              } else throw new Error('Collect package content: unexpected member type');
              if (result.length > 50000) throw new Error('Collect package content: too many files');
            }
            return result;
          }
          for (const [platform, arch] of [['darwin', 'arm64'], ['linux', 'x64'], ['win32', 'x64']]) {
            const root = join(temporary, `content-${platform}`);
            const cache = join(temporary, `content-cache-${platform}`);
            const home = join(temporary, `content-home-${platform}`);
            for (const path of [root, cache, home]) await mkdir(path);
            execFileSync(process.execPath, [tools.npmPath, 'install', '--global', '--prefix', root, '--cache', cache, '--os', platform, '--cpu', arch, '--ignore-scripts', '--include=optional', '--no-audit', '--fund=false', join(temporary, 'artifact/pioneer.tgz')], { env: { PATH: process.env.PATH, HOME: home, TMPDIR: temporary, CI: 'true' }, timeout: 600000, maxBuffer: 4 * 1024 * 1024 });
            const installedPackage = join(root, 'lib/node_modules/@vastward/pioneer');
            const packageRoot = platform === 'win32' ? 'node_modules/@vastward/pioneer' : 'lib/node_modules/@vastward/pioneer';
            const records = [{ path: '', name: '@vastward/pioneer', version: '0.0.1', bin: { pioneer: './dist/cli.js' } }, ...candidate.closure.filter((entry) => matches(entry.os, platform) && matches(entry.cpu, arch))];
            const inventory = { files: [], links: [], shims: [], consumer: [] };
            const packageFiles = new Map();
            for (const entry of records) {
              const source = entry.path ? join(installedPackage, safe(entry.path)) : installedPackage;
              const metadata = JSON.parse(await readFile(join(source, 'package.json')));
              if (metadata.name !== entry.name || metadata.version !== entry.version || !isDeepStrictEqual(bins(metadata.bin ?? {}), bins(entry.bin))) throw new Error('Collect accepted package: identity or bin metadata mismatch');
              const files = await collect(source);
              if (!entry.path) {
                const observed = files.sort((left, right) => left.path.localeCompare(right.path));
                const expected = [...candidate.members].sort((left, right) => left.path.localeCompare(right.path));
                if (JSON.stringify(observed) !== JSON.stringify(expected)) throw new Error('Collect CLI content: installed bytes differ from tested package');
              }
              packageFiles.set(entry.path, files);
              for (const file of files) {
                const path = posix.join(packageRoot, entry.path, file.path);
                inventory.files.push({ ...file, path });
                if (['@bufbuild/protobuf', '@scure/base', 'react', '@tanstack/react-query', '@tanstack/query-core'].includes(entry.name)) inventory.consumer.push({ source: path, path: posix.join(entry.path, file.path), sha256: file.sha256 });
              }
            }
            for (const entry of records) for (const [name, bin] of Object.entries(bins(entry.bin))) {
              const relativeTarget = safe(bin);
              const file = packageFiles.get(entry.path).find((item) => item.path === relativeTarget);
              if (!file) throw new Error('Collect bin mapping: target is absent from accepted package content');
              const boundary = posix.join(packageRoot, entry.path);
              const target = posix.join(boundary, relativeTarget);
              const binRoot = entry.path ? posix.join(packageRoot, entry.path.slice(0, entry.path.lastIndexOf('node_modules/') + 13), '.bin') : platform === 'win32' ? '' : 'bin';
              const path = posix.join(binRoot, name);
              const expected = { package: `${entry.name}@${entry.version}`, boundary, target, sha256: file.sha256, mode: file.mode };
              if (platform === 'win32') for (const suffix of ['', '.cmd', '.ps1']) inventory.shims.push({ path: `${path}${suffix}`, ...expected });
              else inventory.links.push({ path, text: posix.relative(posix.dirname(path), target), ...expected });
            }
            contents.platforms[`${platform}/${arch}`] = inventory;
          }
          const bytes = `${JSON.stringify(contents)}\n`;
          if (Buffer.byteLength(bytes) > 8 * 1024 * 1024) throw new Error('Collect content inventories: manifest exceeds eight MiB');
          await writeFile(join(temporary, 'artifact/contents.json'), bytes, { flag: 'wx', mode: 0o644 });
          CONTENTS
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pioneer-candidate
          path: ${{ runner.temp }}/artifact/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - id: record
        name: Emit trusted canonical transfer tuple
        shell: bash
        env:
          PIONEER_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          PIONEER_ARTIFACT_SHA256: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          node --input-type=module <<'RECORD'
          import { createHash } from 'node:crypto';
          import { appendFileSync, createReadStream, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const files = [];
          for (const path of ['candidate.json', 'pioneer.tgz', 'release.mjs', 'installed-cli.mjs', 'contents.json']) {
            const hash = createHash('sha256');
            for await (const bytes of createReadStream(join(process.env.RUNNER_TEMP, 'artifact', path))) hash.update(bytes);
            files.push({ path, sha256: hash.digest('hex'), mode: 0o644 });
          }
          const accepted = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'identity.json')));
          const transfer = { identity: accepted.identity, candidateSha256: files[0].sha256, helperSha256: files[2].sha256, artifacts: [{ id: process.env.PIONEER_ARTIFACT_ID, archiveSha256: process.env.PIONEER_ARTIFACT_SHA256, files }], installed: null };
          appendFileSync(process.env.GITHUB_OUTPUT, `transfer=${JSON.stringify(transfer)}\nids=${process.env.PIONEER_ARTIFACT_ID}\n`);
          RECORD

  installed:
    needs: candidate
    permissions:
      contents: read
      actions: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, ubuntu-24.04, windows-2022]
        node: ['20.19.0', '24.22.0']
    runs-on: ${{ matrix.runner }}
    env:
      PIONEER_NODE: ${{ matrix.node }}
      PIONEER_RUNNER: ${{ matrix.runner }}
      PIONEER_TRANSFER: ${{ needs.candidate.outputs.transfer }}
      PIONEER_EXTRACTED_IDS: ${{ needs.candidate.outputs.ids }}
      PIONEER_QUALIFICATION: ${{ inputs.qualification }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: Resolve runner paths
        shell: bash
        run: node --input-type=module -e "$PIONEER_PATHS"
      - name: Verify tools
        shell: bash
        run: node --input-type=module -e "$PIONEER_TOOLS"
      - name: Retrieve and fatally verify raw ZIP bytes
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --input-type=module -e "$PIONEER_TRANSPORT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.candidate.outputs.ids }}
          repository: dgtlkitchen/pioneer
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/extracted
          merge-multiple: true
      - name: Bind transfer observations
        shell: bash
        run: |
          node --input-type=module <<'TRANSFER'
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const expected = JSON.parse(process.env.PIONEER_TRANSFER);
          const input = { expected, observed: expected.identity, artifacts: expected.artifacts.map(({ id }) => ({ id, archive: join(process.env.PIONEER_ARCHIVES, `${id}.zip`), root: process.env.PIONEER_EXTRACTED })), installedRoot: null };
          writeFileSync(join(process.env.RUNNER_TEMP, 'transfer-input.json'), JSON.stringify(input), { flag: 'wx' });
          TRANSFER
      - name: Verify helper bytes before import and validate transferred members
        shell: bash
        env:
          PIONEER_MODE: transfer
          PIONEER_INPUT: ${{ runner.temp }}/transfer-input.json
          PIONEER_OUTPUT: ${{ runner.temp }}/transfer.json
        run: node --input-type=module -e "$PIONEER_BOOTSTRAP"
      - name: Install an independent native reference
        shell: bash
        run: |
          node --input-type=module <<'INSTALL'
          import { execFileSync } from 'node:child_process';
          import { mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const tools = JSON.parse(readFileSync(process.env.PIONEER_TOOL_RECORD));
          const temporary = process.env.RUNNER_TEMP;
          for (const name of ['reference-prefix', 'reference-cache', 'reference-home']) mkdirSync(join(temporary, name));
          const environment = { PATH: process.env.PATH, HOME: join(temporary, 'reference-home'), TMPDIR: temporary, TMP: temporary, TEMP: temporary, CI: 'true' };
          for (const key of ['SystemRoot', 'ComSpec', 'WINDIR']) if (process.env[key]) environment[key] = process.env[key];
          execFileSync(process.execPath, [tools.npmPath, 'install', '--global', '--prefix', join(temporary, 'reference-prefix'), '--cache', join(temporary, 'reference-cache'), '--ignore-scripts', '--include=optional', '--no-audit', '--fund=false', join(process.env.PIONEER_EXTRACTED, 'pioneer.tgz')], { env: environment, timeout: 600000, maxBuffer: 4 * 1024 * 1024 });
          const expected = { ...JSON.parse(process.env.PIONEER_TRANSFER), installed: { phase: 'reference', contents: join(process.env.PIONEER_EXTRACTED, 'contents.json'), toolchain: tools, reference: null } };
          const input = JSON.parse(readFileSync(join(temporary, 'transfer-input.json')));
          input.expected = expected;
          input.installedRoot = join(temporary, 'reference-prefix');
          writeFileSync(join(temporary, 'reference-input.json'), JSON.stringify(input), { flag: 'wx' });
          INSTALL
      - name: Validate all reference content before recording exact native shims
        shell: bash
        env:
          PIONEER_MODE: transfer
          PIONEER_INPUT: ${{ runner.temp }}/reference-input.json
          PIONEER_OUTPUT: ${{ runner.temp }}/reference-${{ matrix.runner }}-${{ matrix.node }}.json
        run: node --input-type=module -e "$PIONEER_BOOTSTRAP"
      - name: Bind the independent reference and install into a second cold prefix
        shell: bash
        run: |
          node --input-type=module <<'COLD'
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { createReadStream, mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const tools = JSON.parse(readFileSync(process.env.PIONEER_TOOL_RECORD));
          const temporary = process.env.RUNNER_TEMP;
          const referencePath = join(temporary, `reference-${tools.runner}-${tools.node}.json`);
          const hash = createHash('sha256');
          for await (const bytes of createReadStream(referencePath)) hash.update(bytes);
          const referenceSha256 = hash.digest('hex');
          for (const name of ['prefix', 'cache', 'home']) mkdirSync(join(temporary, name));
          const environment = { PATH: process.env.PATH, HOME: join(temporary, 'home'), TMPDIR: temporary, TMP: temporary, TEMP: temporary, CI: 'true' };
          for (const key of ['SystemRoot', 'ComSpec', 'WINDIR']) if (process.env[key]) environment[key] = process.env[key];
          execFileSync(process.execPath, [tools.npmPath, 'install', '--global', '--prefix', join(temporary, 'prefix'), '--cache', join(temporary, 'cache'), '--ignore-scripts', '--include=optional', '--no-audit', '--fund=false', join(process.env.PIONEER_EXTRACTED, 'pioneer.tgz')], { env: environment, timeout: 600000, maxBuffer: 4 * 1024 * 1024 });
          const input = JSON.parse(readFileSync(join(temporary, 'reference-input.json')));
          input.expected.installed.phase = 'cold';
          input.expected.installed.reference = { path: referencePath, sha256: referenceSha256 };
          input.installedRoot = join(temporary, 'prefix');
          writeFileSync(join(temporary, 'installed-input.json'), JSON.stringify(input), { flag: 'wx' });
          const contents = JSON.parse(readFileSync(join(process.env.PIONEER_EXTRACTED, 'contents.json')));
          const approved = contents.platforms[`${tools.platform}/${tools.arch}`];
          const bin = process.platform === 'win32' ? join(temporary, 'prefix/pioneer.cmd') : join(temporary, 'prefix/bin/pioneer');
          writeFileSync(join(temporary, 'fixture-input.json'), JSON.stringify({ identity: input.expected.identity, candidateSha256: input.expected.candidateSha256, referenceSha256, toolchain: tools, prefix: join(temporary, 'prefix'), root: join(temporary, 'cold'), bin, consumer: approved.consumer }), { flag: 'wx' });
          COLD
      - name: Validate the installed closure and exact npm bin links
        shell: bash
        env:
          PIONEER_MODE: transfer
          PIONEER_INPUT: ${{ runner.temp }}/installed-input.json
          PIONEER_OUTPUT: ${{ runner.temp }}/installed.json
        run: node --input-type=module -e "$PIONEER_BOOTSTRAP"
      - name: Prepare frozen offline inputs
        shell: bash
        env:
          PIONEER_VERIFIER: installed-cli.mjs
          PIONEER_MODE: prepare
          PIONEER_INPUT: ${{ runner.temp }}/fixture-input.json
          PIONEER_OUTPUT: ${{ runner.temp }}/prepared.json
        run: node --input-type=module -e "$PIONEER_BOOTSTRAP"
      - name: Generate through the installed POSIX bin
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/cold"
          env -i PATH="$RUNNER_TEMP/prefix/bin:$PATH" HOME="$RUNNER_TEMP/home" TMPDIR="$RUNNER_TEMP" CI=true pioneer --input-path proto --output-path sdk --package-name @example/cold-sdk --react
      - name: Generate through the native Windows shim
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $temporary = $env:RUNNER_TEMP
          $environment = @{ PATH = "$temporary\prefix;$env:PATH"; HOME = "$temporary\home"; TEMP = $temporary; TMP = $temporary; CI = 'true'; SystemRoot = $env:SystemRoot; ComSpec = $env:ComSpec; WINDIR = $env:WINDIR }
          Get-ChildItem Env: | ForEach-Object { Remove-Item "Env:$($_.Name)" }
          foreach ($entry in $environment.GetEnumerator()) { Set-Item "Env:$($entry.Key)" $entry.Value }
          Set-Location "$temporary\cold"
          pioneer.cmd --input-path proto --output-path sdk --package-name '@example/cold-sdk' --react
          if ($LASTEXITCODE -ne 0) { throw 'Installed CLI generation failed' }
      - name: Check runtime behavior and preserve rejected outputs
        shell: bash
        env:
          PIONEER_VERIFIER: installed-cli.mjs
          PIONEER_MODE: check
          PIONEER_INPUT: ${{ runner.temp }}/fixture-input.json
          PIONEER_OUTPUT: ${{ runner.temp }}/receipt-${{ matrix.runner }}-${{ matrix.node }}.json
        run: node --input-type=module -e "$PIONEER_BOOTSTRAP"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: receipt-${{ matrix.runner }}-${{ matrix.node }}
          path: |
            ${{ runner.temp }}/receipt-${{ matrix.runner }}-${{ matrix.node }}.json
            ${{ runner.temp }}/reference-${{ matrix.runner }}-${{ matrix.node }}.json
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: [candidate, installed]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm-pioneer
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      PIONEER_NODE: '24.22.0'
      PIONEER_RUNNER: ubuntu-24.04
      PIONEER_TRANSFER: ${{ toJSON(fromJSON(vars.PIONEER_RELEASE_APPROVAL).transfer) }}
      PIONEER_EXTRACTED_IDS: ${{ join(fromJSON(vars.PIONEER_RELEASE_APPROVAL).transfer.artifacts.*.id, ',') }}
      PIONEER_APPROVAL: ${{ vars.PIONEER_RELEASE_APPROVAL }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.0'
      - name: Resolve runner paths
        shell: bash
        run: node --input-type=module -e "$PIONEER_PATHS"
      - name: Verify publisher tools
        shell: bash
        run: node --input-type=module -e "$PIONEER_TOOLS"
      - name: Retrieve protected exact artifact IDs
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --input-type=module -e "$PIONEER_TRANSPORT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ env.PIONEER_EXTRACTED_IDS }}
          repository: dgtlkitchen/pioneer
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/extracted
          merge-multiple: true
      - name: Bind approved transfer and six receipts
        shell: bash
        run: |
          node --input-type=module <<'INPUTS'
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const approval = JSON.parse(process.env.PIONEER_APPROVAL);
          const expected = approval.transfer;
          const transfer = { expected, observed: expected.identity, artifacts: expected.artifacts.map(({ id }) => ({ id, archive: join(process.env.PIONEER_ARCHIVES, `${id}.zip`), root: process.env.PIONEER_EXTRACTED })), installedRoot: null };
          writeFileSync(join(process.env.RUNNER_TEMP, 'transfer-input.json'), JSON.stringify(transfer), { flag: 'wx' });
          const receipts = approval.receipts.map(({ path, sha256 }) => {
            if (!/^receipt-(macos-14|ubuntu-24.04|windows-2022)-(20\.19\.0|24\.22\.0)\.json$/.test(path)) throw new Error('Bind receipt: unexpected member');
            return { path: join(process.env.PIONEER_EXTRACTED, path), sha256, referencePath: join(process.env.PIONEER_EXTRACTED, path.replace(/^receipt-/, 'reference-')) };
          });
          writeFileSync(join(process.env.RUNNER_TEMP, 'matrix-input.json'), JSON.stringify({ identity: expected.identity, candidateSha256: expected.candidateSha256, receipts }), { flag: 'wx' });
          INPUTS
      - name: Validate exact transferred members
        shell: bash
        env:
          PIONEER_MODE: transfer
          PIONEER_INPUT: ${{ runner.temp }}/transfer-input.json
          PIONEER_OUTPUT: ${{ runner.temp }}/transfer.json
        run: node --input-type=module -e "$PIONEER_BOOTSTRAP"
      - name: Validate all six independent receipts
        shell: bash
        env:
          PIONEER_MODE: matrix
          PIONEER_INPUT: ${{ runner.temp }}/matrix-input.json
          PIONEER_OUTPUT: ${{ runner.temp }}/matrix.json
        run: node --input-type=module -e "$PIONEER_BOOTSTRAP"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pioneer-matrix
          path: ${{ runner.temp }}/matrix.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish the accepted bytes through trusted publishing only
        shell: bash
        run: |
          node --input-type=module <<'PUBLISH'
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { createReadStream, mkdirSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const approval = JSON.parse(process.env.PIONEER_APPROVAL);
          const authority = approval.publication;
          if (process.env.RUNNER_ENVIRONMENT !== 'github-hosted') throw new Error('Publish candidate: expected the approved GitHub-hosted runner environment');
          if (authority.repository !== 'dgtlkitchen/pioneer' || authority.workflow !== 'release.yml' || authority.environment !== 'npm-pioneer' || authority.allowedAction !== 'npm publish' || authority.validated !== true || !Number.isFinite(Date.parse(authority.expiresAt)) || Date.parse(authority.expiresAt) <= Date.now()) throw new Error('Publish candidate: missing current direct-publish authority');
          for (const key of ['licenseSha256', 'archiveDraftSha256', 'permissionSha256']) if (typeof authority[key] !== 'string' || !/^[a-f0-9]{64}$/.test(authority[key])) throw new Error('Publish candidate: missing independently accepted release evidence');
          const matrixHash = createHash('sha256');
          for await (const bytes of createReadStream(join(process.env.RUNNER_TEMP, 'matrix.json'))) matrixHash.update(bytes);
          if (matrixHash.digest('hex') !== approval.matrixSha256) throw new Error('Publish candidate: matrix differs from protected approval');
          const tarballs = approval.transfer.artifacts.flatMap((artifact) => artifact.files.filter((file) => file.path === 'pioneer.tgz'));
          if (tarballs.length !== 1) throw new Error('Publish candidate: ambiguous protected tarball');
          const tarballHash = createHash('sha256');
          for await (const bytes of createReadStream(join(process.env.PIONEER_EXTRACTED, 'pioneer.tgz'))) tarballHash.update(bytes);
          if (tarballHash.digest('hex') !== tarballs[0].sha256) throw new Error('Publish candidate: tarball differs from protected approval');
          const tools = JSON.parse(readFileSync(process.env.PIONEER_TOOL_RECORD));
          const home = join(process.env.RUNNER_TEMP, 'publisher-home');
          mkdirSync(home);
          const environment = { PATH: process.env.PATH, HOME: home, TMPDIR: process.env.RUNNER_TEMP, CI: 'true' };
          for (const key of ['GITHUB_ACTIONS', 'GITHUB_REPOSITORY', 'GITHUB_REPOSITORY_ID', 'GITHUB_REPOSITORY_OWNER_ID', 'GITHUB_REF', 'GITHUB_SHA', 'GITHUB_WORKFLOW_REF', 'GITHUB_EVENT_NAME', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'GITHUB_SERVER_URL', 'RUNNER_ENVIRONMENT', 'ACTIONS_ID_TOKEN_REQUEST_URL', 'ACTIONS_ID_TOKEN_REQUEST_TOKEN']) {
            if (!process.env[key]) throw new Error('Publish candidate: missing trusted-publisher identity');
            environment[key] = process.env[key];
          }
          execFileSync(process.execPath, [tools.npmPath, 'publish', join(process.env.PIONEER_EXTRACTED, 'pioneer.tgz'), '--access', 'public', '--ignore-scripts', '--provenance'], { env: environment, timeout: 300000, maxBuffer: 4 * 1024 * 1024 });
          PUBLISH

  verify:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm-pioneer
    permissions:
      contents: read
      actions: read
    env:
      PIONEER_NODE: '24.22.0'
      PIONEER_RUNNER: ubuntu-24.04
      PIONEER_TRANSFER: ${{ toJSON(fromJSON(vars.PIONEER_REGISTRY_APPROVAL).transfer) }}
      PIONEER_EXTRACTED_IDS: ${{ join(fromJSON(vars.PIONEER_REGISTRY_APPROVAL).transfer.artifacts.*.id, ',') }}
      PIONEER_APPROVAL: ${{ vars.PIONEER_REGISTRY_APPROVAL }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.0'
      - name: Resolve runner paths
        shell: bash
        run: node --input-type=module -e "$PIONEER_PATHS"
      - name: Verify registry-verification tools
        shell: bash
        run: node --input-type=module -e "$PIONEER_TOOLS"
      - name: Retrieve independently approved verification assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --input-type=module -e "$PIONEER_TRANSPORT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ env.PIONEER_EXTRACTED_IDS }}
          repository: dgtlkitchen/pioneer
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/extracted
          merge-multiple: true
      - name: Bind verification transfer
        shell: bash
        run: |
          node --input-type=module <<'TRANSFER'
          import { writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const expected = JSON.parse(process.env.PIONEER_TRANSFER);
          writeFileSync(join(process.env.RUNNER_TEMP, 'transfer-input.json'), JSON.stringify({ expected, observed: expected.identity, artifacts: expected.artifacts.map(({ id }) => ({ id, archive: join(process.env.PIONEER_ARCHIVES, `${id}.zip`), root: process.env.PIONEER_EXTRACTED })), installedRoot: null }), { flag: 'wx' });
          TRANSFER
      - name: Validate verification assets before registry access
        shell: bash
        env:
          PIONEER_MODE: transfer
          PIONEER_INPUT: ${{ runner.temp }}/transfer-input.json
          PIONEER_OUTPUT: ${{ runner.temp }}/transfer.json
        run: node --input-type=module -e "$PIONEER_BOOTSTRAP"
      - name: Retrieve published bytes and verify signatures in an approved local tree
        shell: bash
        run: |
          node --input-type=module <<'REGISTRY'
          import { execFileSync } from 'node:child_process';
          import { mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { isDeepStrictEqual } from 'node:util';
          const approval = JSON.parse(process.env.PIONEER_APPROVAL);
          if (!isDeepStrictEqual(approval.provenance.artifacts, approval.transfer.artifacts) || !isDeepStrictEqual(approval.provenance.identity, approval.transfer.identity) || approval.provenance.candidateSha256 !== approval.transfer.candidateSha256) throw new Error('Verify registry: provenance approval differs from verified transfer');
          if (approval.registry.name !== '@vastward/pioneer' || approval.registry.version !== '0.0.1' || approval.registry.run !== process.env.GITHUB_RUN_ID || approval.registry.attempt !== process.env.GITHUB_RUN_ATTEMPT || Date.parse(approval.registry.expiresAt) <= Date.now() || !Number.isFinite(Date.parse(approval.registry.expiresAt))) throw new Error('Verify registry: missing current installation and audit authority');
          const tools = JSON.parse(readFileSync(process.env.PIONEER_TOOL_RECORD));
          const temporary = process.env.RUNNER_TEMP;
          for (const name of ['registry', 'registry-cache', 'registry-home', 'registry-bytes']) mkdirSync(join(temporary, name));
          const environment = { PATH: process.env.PATH, HOME: join(temporary, 'registry-home'), TMPDIR: temporary, CI: 'true' };
          const options = { env: environment, timeout: 300000, maxBuffer: 8 * 1024 * 1024, cwd: join(temporary, 'registry') };
          writeFileSync(join(temporary, 'registry/package.json'), '{"private":true}', { flag: 'wx' });
          execFileSync(process.execPath, [tools.npmPath, 'install', '@vastward/pioneer@0.0.1', '--ignore-scripts', '--cache', join(temporary, 'registry-cache'), '--no-audit', '--fund=false'], options);
          const packed = JSON.parse(execFileSync(process.execPath, [tools.npmPath, 'pack', '@vastward/pioneer@0.0.1', '--ignore-scripts', '--cache', join(temporary, 'registry-cache'), '--pack-destination', join(temporary, 'registry-bytes'), '--json'], options));
          if (packed.length !== 1 || packed[0].filename !== 'vastward-pioneer-0.0.1.tgz') throw new Error('Verify registry: unexpected tarball identity');
          const audit = execFileSync(process.execPath, [tools.npmPath, 'audit', 'signatures', '--json', '--include-attestations'], options);
          writeFileSync(join(temporary, 'audit.json'), audit, { flag: 'wx' });
          writeFileSync(join(temporary, 'provenance-input.json'), JSON.stringify({ expected: approval.provenance, audit: join(temporary, 'audit.json'), registryTarball: join(temporary, 'registry-bytes/vastward-pioneer-0.0.1.tgz'), candidate: join(process.env.PIONEER_EXTRACTED, 'candidate.json'), matrix: join(process.env.PIONEER_EXTRACTED, 'matrix.json') }), { flag: 'wx' });
          REGISTRY
      - name: Compare actual verified provenance with protected approval
        shell: bash
        env:
          PIONEER_MODE: provenance
          PIONEER_INPUT: ${{ runner.temp }}/provenance-input.json
          PIONEER_OUTPUT: ${{ runner.temp }}/registry-verification.json
        run: node --input-type=module -e "$PIONEER_BOOTSTRAP"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pioneer-registry-verification
          path: ${{ runner.temp }}/registry-verification.json
          if-no-files-found: error
          retention-days: 90
